<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angsflow - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#60A5FA',
                        secondary: '#3B82F6',
                        accent: '#F59E0B',
                        dark: '#0F172A',
                        light: '#F8FAFC'
                    },
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif']
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'slide-up': 'slideUp 0.8s ease-out',
                        'fade-in': 'fadeIn 1s ease-out',
                        'slide-in-right': 'slideInRight 0.6s ease-out',
                        'slide-out-left': 'slideOutLeft 0.6s ease-out'
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        @keyframes glow {
            from { box-shadow: 0 0 20px #60A5FA40; }
            to { box-shadow: 0 0 30px #60A5FA80, 0 0 40px #60A5FA40; }
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOutLeft {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(-100%); opacity: 0; }
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .gradient-text {
            background: linear-gradient(135deg, #60A5FA, #3B82F6, #1E40AF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .input-focus:focus {
            border-color: #60A5FA;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
        }
    </style>
</head>
<body class="font-inter bg-gradient-to-br from-slate-900 via-blue-900 to-indigo-900 min-h-screen overflow-x-hidden">
    <!-- Animated Background -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-40 w-80 h-80 bg-primary/20 rounded-full blur-3xl animate-float"></div>
        <div class="absolute top-1/2 -left-40 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl animate-float" style="animation-delay: -2s;"></div>
        <div class="absolute bottom-0 right-1/3 w-64 h-64 bg-indigo-500/15 rounded-full blur-3xl animate-float" style="animation-delay: -4s;"></div>
    </div>

    <!-- Language Selector -->
    <div class="fixed top-6 right-6 z-50">
        <div class="glass-effect rounded-full p-2 border border-white/20">
            <select id="languageSelector" class="bg-transparent text-white text-sm font-medium border-none outline-none cursor-pointer">
                <option value="id" class="bg-slate-800 text-white">🇮🇩 ID</option>
                <option value="en" class="bg-slate-800 text-white">🇺🇸 EN</option>
            </select>
        </div>
    </div>

    <!-- Main Container -->
    <div class="min-h-screen flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-md relative">
            
            <!-- Register Screen -->
            <div class="glass-effect rounded-3xl p-8 border border-white/20 shadow-2xl animate-slide-up">
                <!-- Logo -->
                <div class="text-center mb-8">
                    <div class="flex justify-center mb-4">
                        <svg width="64" height="64" viewBox="0 0 48 48" class="animate-glow">
                            <circle cx="24" cy="24" r="22" fill="url(#logoGradient)" stroke="rgba(96, 165, 250, 0.3)" stroke-width="2"/>
                            <path d="M16 32 L20 20 L24 32 M18 28 L22 28" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M28 32 L28 20 M28 20 L34 20 M28 26 L32 26" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                            <defs>
                                <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
                                    <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <h1 class="text-3xl font-bold text-white mb-2">
                        Bergabung dengan <span class="gradient-text">Angsflow</span>
                    </h1>
                    <p class="text-white/70" data-text="register-subtitle">Buat akun baru untuk memulai</p>
                </div>

                <!-- Register Form -->
                <form id="registerForm" class="space-y-6">
                    <div>
                        <label class="block text-white/80 text-sm font-medium mb-2" data-text="full-name">Nama Lengkap</label>
                        <input 
                            type="text" 
                            id="registerName"
                            class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/50 input-focus transition-all duration-300"
                            placeholder="John Doe"
                            required
                        >
                    </div>
                    <div>
                        <label class="block text-white/80 text-sm font-medium mb-2" data-text="email">Email</label>
                        <input 
                            type="email" 
                            id="registerEmail"
                            class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/50 input-focus transition-all duration-300"
                            placeholder="nama@email.com"
                            required
                        >
                    </div>
                    <div>
                        <label class="block text-white/80 text-sm font-medium mb-2" data-text="password">Password</label>
                        <div class="relative">
                            <input 
                                type="password" 
                                id="registerPassword"
                                class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/50 input-focus transition-all duration-300 pr-12"
                                placeholder="••••••••"
                                required
                            >
                            <button type="button" onclick="togglePassword('registerPassword')" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-white/50 hover:text-white transition-colors">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                </svg>
                            </button>
                        </div>
                        <p class="text-white/50 text-xs mt-1" data-text="password-hint">Minimal 8 karakter dengan kombinasi huruf dan angka</p>
                    </div>
                    <div>
                        <label class="block text-white/80 text-sm font-medium mb-2" data-text="confirm-password">Konfirmasi Password</label>
                        <div class="relative">
                            <input 
                                type="password" 
                                id="confirmPassword"
                                class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/50 input-focus transition-all duration-300 pr-12"
                                placeholder="••••••••"
                                required
                            >
                            <button type="button" onclick="togglePassword('confirmPassword')" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-white/50 hover:text-white transition-colors">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-start">
                        <input type="checkbox" id="agreeTerms" class="w-4 h-4 text-primary bg-white/10 border-white/20 rounded focus:ring-primary focus:ring-2 mt-1" required>
                        <label for="agreeTerms" class="ml-2 text-white/70 text-sm">
                            <span data-text="agree-terms">Saya setuju dengan</span>
                            <a href="#" class="text-primary hover:text-blue-300 transition-colors" data-text="terms-service">Syarat & Ketentuan</a>
                            <span data-text="and">dan</span>
                            <a href="#" class="text-primary hover:text-blue-300 transition-colors" data-text="privacy-policy">Kebijakan Privasi</a>
                        </label>
                    </div>

                    <button 
                        type="submit"
                        class="w-full bg-gradient-to-r from-emerald-500 to-green-600 hover:from-green-600 hover:to-emerald-500 text-white py-3 rounded-xl font-semibold text-lg transition-all duration-300 shadow-lg hover:shadow-emerald-500/25 transform hover:scale-105"
                        data-text="register-button"
                    >
                        Daftar Sekarang
                    </button>
                </form>

                <!-- Switch to Login -->
                <div class="text-center mt-6">
                    <p class="text-white/70">
                        <span data-text="have-account">Sudah punya akun?</span>
                        <a 
                            href="login.html" 
                            class="text-primary hover:text-blue-300 font-medium ml-1 transition-colors"
                            data-text="login-link"
                        >
                            Masuk di sini
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Language translations
        const translations = {
            id: {
                'register-subtitle': 'Buat akun baru untuk memulai',
                'full-name': 'Nama Lengkap',
                'email': 'Email',
                'password': 'Password',
                'confirm-password': 'Konfirmasi Password',
                'password-hint': 'Minimal 8 karakter dengan kombinasi huruf dan angka',
                'agree-terms': 'Saya setuju dengan',
                'terms-service': 'Syarat & Ketentuan',
                'and': 'dan',
                'privacy-policy': 'Kebijakan Privasi',
                'register-button': 'Daftar Sekarang',
                'have-account': 'Sudah punya akun?',
                'login-link': 'Masuk di sini'
            },
            en: {
                'register-subtitle': 'Create a new account to get started',
                'full-name': 'Full Name',
                'email': 'Email',
                'password': 'Password',
                'confirm-password': 'Confirm Password',
                'password-hint': 'Minimum 8 characters with letters and numbers',
                'agree-terms': 'I agree to the',
                'terms-service': 'Terms & Conditions',
                'and': 'and',
                'privacy-policy': 'Privacy Policy',
                'register-button': 'Sign Up Now',
                'have-account': 'Already have an account?',
                'login-link': 'Sign in here'
            }
        };

        let currentLanguage = 'id';

        // Language switching
        document.getElementById('languageSelector').addEventListener('change', function(e) {
            currentLanguage = e.target.value;
            updateLanguage();
        });

        function updateLanguage() {
            const elements = document.querySelectorAll('[data-text]');
            elements.forEach(element => {
                const key = element.getAttribute('data-text');
                if (translations[currentLanguage][key]) {
                    element.textContent = translations[currentLanguage][key];
                }
            });
        }

        // Password toggle
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
        }

        // Form submission
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const agreeTerms = document.getElementById('agreeTerms').checked;
            
            if (password !== confirmPassword) {
                alert('Password tidak cocok!');
                return;
            }
            
            if (!agreeTerms) {
                alert('Anda harus menyetujui syarat dan ketentuan!');
                return;
            }
            
            if (name && email && password) {
                // Redirect to onboarding
                window.location.href = 'onboarding.html';
            }
        });

        // Initialize language
        updateLanguage();
    </script>
</body>
</html>
